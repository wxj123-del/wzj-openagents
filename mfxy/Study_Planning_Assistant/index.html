<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI学习规划助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="header-content">
      <h1 class="app-title">📚 AI学习规划助手</h1>
      <div class="header-actions">
        <button id="keys-settings-btn" class="btn btn-secondary">密钥设置</button>
        <button onclick="window.open('https://xingyun3d.com/developers/52-183', '_blank')" class="btn btn-secondary">使用说明</button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-container">
    <!-- 数字人显示区域 -->
    <section class="avatar-section">
      <div id="avatar-container" class="avatar-container">
        <!-- SDK会在这里渲染数字人，容器必须为空 -->
      </div>

      <!-- 控制按钮和状态 -->
      <div class="avatar-controls">
        <div id="connection-status" class="connection-status">⚪ 未连接</div>
        <div id="avatar-state" class="avatar-state">状态: 离线</div>
        <div class="control-buttons">
          <button id="connect-btn" class="btn btn-primary btn-large">连接数字人</button>
          <button id="disconnect-btn" class="btn btn-danger btn-large" disabled>断开连接</button>
        </div>
      </div>
    </section>

    <!-- 交互区域 -->
    <section class="interaction-section">
      <!-- 交互历史记录 -->
      <div class="chat-history-container">
        <div class="section-header">
          <h2>💬 对话记录</h2>
          <button id="clear-history-btn" class="btn btn-text">清空记录</button>
        </div>
        <div id="chat-history" class="chat-history">
          <div class="chat-message chat-message-system">
            <div class="message-header">
              <span class="message-label">系统</span>
              <span class="message-time">欢迎</span>
            </div>
            <div class="message-content">
              欢迎使用AI学习规划助手！请先点击"连接数字人"按钮连接数字人，然后就可以开始对话了。
            </div>
          </div>
        </div>
      </div>

      <!-- 快速操作 -->
      <div class="quick-actions">
        <button id="action-planning" class="btn btn-action">📝 制定学习计划</button>
        <button id="action-progress" class="btn btn-action">📊 查看进度</button>
        <button id="action-reminder" class="btn btn-action">⏰ 学习提醒</button>
      </div>

      <!-- 输入区域 -->
      <div class="input-container">
        <textarea
          id="message-input"
          class="message-input"
          placeholder="输入你想说的话...（例如：我上高二，想提升数学成绩）"
          rows="3"
        ></textarea>
        <button id="send-btn" class="btn btn-primary btn-send" disabled>发送</button>
      </div>
    </section>
  </main>

  <!-- 密钥设置弹窗 -->
  <div id="keys-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🔑 密钥设置</h2>
        <button id="close-modal-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="key-status" style="background: #f0f7ff; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #4A90E2;">
          <strong>🔑 当前密钥状态：</strong>
          <span id="key-status-text">检测中...</span>
        </div>

        <div class="form-group">
          <label for="key-appid">魔珐星云 App ID</label>
          <input
            type="text"
            id="key-appid"
            class="form-input"
            placeholder="输入 App ID"
            value=""
          >
        </div>
        <div class="form-group">
          <label for="key-secret">魔珐星云 App Secret</label>
          <input
            type="password"
            id="key-secret"
            class="form-input"
            placeholder="输入 App Secret"
            value=""
          >
        </div>
        <div class="form-group">
          <label for="key-modelscope">魔搭社区 API Key</label>
          <input
            type="password"
            id="key-modelscope"
            class="form-input"
            placeholder="输入 ModelScope API Key"
            value=""
          >
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="use-test-keys" checked>
            使用内置测试密钥
          </label>
        </div>
        <div class="form-group">
          <small style="color: #666; display: block; margin-top: 5px;">
            💡 提示：已保存的密钥会自动填充，如需修改请直接编辑
          </small>
        </div>
        <div class="modal-footer">
          <button id="save-keys-btn" class="btn btn-primary">保存</button>
          <button id="cancel-keys-btn" class="btn btn-secondary">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载动画 -->
  <div id="loading-indicator" class="loading-indicator" style="display: none;">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中...</div>
  </div>

  <!-- 引入SDK -->
  <script src="https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js" onerror="console.error('SDK加载失败');document.body.innerHTML+='<div style=\'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.2);text-align:center;\'><h3>⚠️ SDK加载失败</h3><p>请检查网络连接或刷新页面重试</p><button onclick=\'location.reload()\' style=\'padding:10px 20px;background:#4A90E2;color:white;border:none;border-radius:5px;cursor:pointer;\'>刷新页面</button></div>'"></script>

  <!-- 引入配置和模块 -->
  <script src="config.js"></script>
  <script src="modules/storageManager.js"></script>
  <script src="modules/avatarController.js"></script>
  <script src="modules/aiModelClient.js"></script>
  <script src="modules/uiManager.js"></script>
  <script src="modules/learningPlanner.js"></script>

  <!-- 引入主应用 -->
  <script src="app.js"></script>
</body>
</html>
